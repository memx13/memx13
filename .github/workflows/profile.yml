# Keeps the live parts of the profile README up to date without any external
# image host: everything is generated here and stored in this repository.
#
#   visuals -> draws the contribution-graph snake and the language card,
#              publishes the SVG files to the "output" branch
#   recent  -> rewrites the "latest pushes" table between the
#              <!-- recent:start --> / <!-- recent:end --> markers in README.md,
#              and the open-source contributions table (pull requests to
#              repositories owned by someone else) between
#              <!-- contrib:start --> / <!-- contrib:end -->.
#
# Only the built-in GITHUB_TOKEN is used. No personal access token or secret.
name: Profile visuals

on:
  schedule:
    - cron: "17 3 * * *" # once a day, 03:17 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  visuals:
    name: Snake and language card
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Contribution snake (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark

      # fail_on_error stops the job instead of publishing an error card,
      # so the previous good files stay on the output branch.
      # disable_animations keeps the card readable where CSS animations do not run.
      - name: Language card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&disable_animations=true&hide_border=true&bg_color=00000000&title_color=0969da&text_color=1f2328&custom_title=Languages%20by%20code%20size
          path: dist/langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Language card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&disable_animations=true&hide_border=true&bg_color=00000000&title_color=58a6ff&text_color=e6edf3&custom_title=Languages%20by%20code%20size
          path: dist/langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Publish SVG files to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  recent:
    name: README tables
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Rebuild the table from the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          owner = os.environ["OWNER"]
          token = os.environ["GH_TOKEN"]


          def api(path):
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:  # e.g. a repository without releases
                      return None
                  raise


          repos = api(f"/users/{owner}/repos?per_page=100&type=owner&sort=pushed") or []
          repos = [
              repo
              for repo in repos
              if not repo["fork"]
              and not repo["archived"]
              and not repo["private"]
              and repo["name"].lower() != owner.lower()  # skip this profile repository
          ]
          repos.sort(key=lambda repo: repo["pushed_at"], reverse=True)

          rows = [
              "| Repository | Language | Last push | Latest release |",
              "| --- | --- | --- | --- |",
          ]
          for repo in repos[:5]:
              release = api(f"/repos/{owner}/{repo['name']}/releases/latest")
              release_cell = f"[{release['tag_name']}]({release['html_url']})" if release else "—"
              rows.append(
                  f"| [{repo['name']}]({repo['html_url']}) "
                  f"| {repo['language'] or '—'} "
                  f"| {repo['pushed_at'][:10]} "
                  f"| {release_cell} |"
              )

          start, end = "<!-- recent:start -->", "<!-- recent:end -->"
          with open("README.md", encoding="utf-8", newline="") as handle:
              readme = handle.read()
          if start not in readme or end not in readme:
              raise SystemExit("recent:start / recent:end markers not found in README.md")

          block = start + "\n" + "\n".join(rows) + "\n" + end
          updated = re.sub(
              re.escape(start) + r".*?" + re.escape(end),
              lambda match: block,
              readme,
              flags=re.S,
          )
          if updated != readme:
              with open("README.md", "w", encoding="utf-8", newline="") as handle:
                  handle.write(updated)
          PY

      - name: Rebuild the open-source contributions table
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          owner = os.environ["OWNER"]
          token = os.environ.get("GH_TOKEN", "")


          def api(path):
              headers = {"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              request = urllib.request.Request("https://api.github.com" + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)


          def cell(text):
              return " ".join((text or "").split()).replace("|", "\\|")


          # Pull requests opened by the owner in repositories owned by someone else
          query = urllib.parse.quote(f"is:pr author:{owner} -user:{owner}")
          items = api(f"/search/issues?q={query}&per_page=100")["items"]

          # "docs: add @owner as a contributor" only lists the owner in a README; it is not a contribution
          self_listing = re.compile(rf"\b(add|update) @{re.escape(owner)} as a contributor\b", re.IGNORECASE)

          merged, still_open = [], []
          for item in items:
              if self_listing.search(item["title"]):
                  continue
              merged_at = (item.get("pull_request") or {}).get("merged_at")
              if merged_at:
                  merged.append((item, merged_at))
              elif item["state"] == "open":
                  still_open.append((item, None))
              # closed without being merged: left out
          merged.sort(key=lambda pair: pair[1], reverse=True)
          still_open.sort(key=lambda pair: pair[0]["created_at"], reverse=True)

          descriptions = {}
          rows = [
              "| Project | Pull request | Status |",
              "| --- | --- | --- |",
          ]
          for item, merged_at in merged + still_open:
              repo = item["repository_url"].split("/repos/", 1)[1]
              if repo not in descriptions:
                  descriptions[repo] = cell(api(f"/repos/{repo}").get("description"))
              project = f"[{repo.split('/', 1)[1]}](https://github.com/{repo})"
              if descriptions[repo]:
                  project += f"<br><sub>{descriptions[repo]}</sub>"
              status = f"Merged {merged_at[:10]}" if merged_at else "Open"
              rows.append(f"| {project} | [{cell(item['title'])}]({item['html_url']}) | {status} |")

          start, end = "<!-- contrib:start -->", "<!-- contrib:end -->"
          with open("README.md", encoding="utf-8", newline="") as handle:
              readme = handle.read()
          if start not in readme or end not in readme:
              raise SystemExit("contrib:start / contrib:end markers not found in README.md")

          block = start + "\n" + "\n".join(rows) + "\n" + end
          updated = re.sub(
              re.escape(start) + r".*?" + re.escape(end),
              lambda match: block,
              readme,
              flags=re.S,
          )
          if updated != readme:
              with open("README.md", "w", encoding="utf-8", newline="") as handle:
                  handle.write(updated)
          PY

      - name: Commit if a table changed
        run: |
          if git diff --quiet; then
            echo "Tables are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh README tables"
          git push
